<title>삼평중 고입 노선도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 레이아웃: 지하철 노선도 메타포 — 학교 유형 = 노선 색, 삼평중 = 출발역. 한 열 앱 화면(최대 720px) */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5d6a78; --line:#d9dfe6;
  --accent:#1d5fd1; --accent-ink:#ffffff; --soft:#e8eef9; --warn:#b4590b; --good:#1f7a45; --bad:#b3261e;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#19212a; --ink:#e7edf3; --muted:#9aa8b6; --line:#2c3743;
  --accent:#6ea0ff; --accent-ink:#0b1320; --soft:#1d2a3c; --warn:#f0a35a; --good:#5cc98a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --ink:#e7edf3; --muted:#9aa8b6; --line:#2c3743;
  --accent:#6ea0ff; --accent-ink:#0b1320; --soft:#1d2a3c; --warn:#f0a35a; --good:#5cc98a; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.2} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button{font:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
/* 헤더 */
.top{display:flex;flex-direction:column;gap:8px}
.station{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.station .dot{width:16px;height:16px;border-radius:50%;border:4px solid var(--accent);background:var(--surface);flex:none}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 6px;border-radius:8px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink)}
/* 노선 칩 */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;letter-spacing:.02em;color:var(--c);border:1.5px solid var(--c);border-radius:999px;padding:1px 9px;white-space:nowrap}
/* 테스트 */
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--accent);transition:width .25s}
.qnum{font-family:var(--display);color:var(--accent);font-size:1.1rem;letter-spacing:.04em}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt .k{font-family:var(--display);color:var(--accent);flex:none;width:1.2em}
/* 결과 노선 */
.route{display:flex;flex-direction:column;gap:0;position:relative}
.stop{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:stretch}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:6px;background:var(--line);border-radius:3px}
.stop:first-child .rail::before{top:22px}
.stop:last-child .rail::before{bottom:calc(100% - 22px)}
.rank{position:relative;margin-top:4px;width:36px;height:36px;border-radius:50%;background:var(--surface);border:5px solid var(--c);display:grid;place-items:center;font-family:var(--display);font-size:1rem;z-index:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px;width:100%;min-width:0}
.card:hover{border-color:var(--c)}
.card .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.why{font-size:.88rem}
/* 성향 막대 */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 2.4em;gap:10px;align-items:center;font-size:.86rem}
.bar .t{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .t b{display:block;height:100%;background:var(--c);border-radius:5px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
/* 상세 */
.dtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dtabs button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:700}
.dtabs button[aria-selected="true"]{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fact{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.fact .l{font-size:.75rem;letter-spacing:.06em;color:var(--muted)}
.fact .n{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.85rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.pc{grid-template-columns:1fr}.bar{grid-template-columns:6.5em 1fr 2.2em}}
.pc .panel h3{display:flex;gap:6px;align-items:center}
.pros h3{color:var(--good)} .cons h3{color:var(--bad)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.stack span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.commute{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.commute .ln{height:6px;border-radius:3px;background:var(--c);position:relative}
.commute .end{width:14px;height:14px;border-radius:50%;border:4px solid var(--c);background:var(--surface)}
.note{font-size:.8rem;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px}
.back{align-self:flex-start;background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}
.list{display:grid;gap:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
.field input,.field select{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field input:focus-visible,.field select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
a.btn{text-decoration:none;display:inline-block;text-align:center}
a.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.ok{font-size:.85rem;color:var(--good)}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:.9rem;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

   미리 채우기 값은 ID(학번), CLASS, NUM, NAME, R1, R2, R3, TYPE, ANS 로 입력해서 링크를 만드세요. */

/* ---------- 로그인 (학번 + 성명) ----------
   학번: 학년 1자리 + 반 1~2자리 + 번호 2자리 → 1105 = 1학년 1반 5번, 11005 = 1학년 10반 5번 */
let USER = null;
function parseId(raw){
  const d=String(raw||"").replace(/\D/g,"");
  let g,c,n;
  if(d.length===4){ g=+d[0]; c=+d[1]; n=+d.slice(2); }
  else if(d.length===5){ g=+d[0]; c=+d.slice(1,3); n=+d.slice(3); }
  else return null;
  if(g<1||g>3||c<1||c>15||n<1||n>50) return null;
  return {id:d, grade:g, cls:c, num:n};
}
function validName(v){ return /^[가-힣a-zA-Z ]{2,10}$/.test(v) && !/[ㄱ-ㅎㅏ-ㅣ]/.test(v); }
const idLabel=u=>`${u.grade}학년 ${u.cls}반 ${u.num}번`;
function loadAnswers(){
  S.ans=Array(QUESTIONS.length).fill(null); S.result=null;
  if(!USER) return;
  try{const saved=JSON.parse(localStorage.getItem("goip-ans-"+USER.id)||"null"); if(Array.isArray(saved)&&saved.length===QUESTIONS.length&&saved.every(a=>a!==null)){S.ans=saved;S.result=compute();}}catch(e){}
}
try{ const u=JSON.parse(localStorage.getItem("goip-user")||"null"); if(u&&parseId(u.id)&&validName(u.name)) USER={...parseId(u.id),name:u.name}; }catch(e){}

/* 유형별로 받을 수 있는 최대 점수 — 문항 수가 많은 유형이 유리하지 않도록 '맞는 정도(%)'로 바꿔 비교 */
const MAXW={}; TYPE_ORDER.forEach(t=>MAXW[t]=QUESTIONS.reduce((a,q)=>a+Math.max(0,...q.o.map(o=>o[1][t]||0)),0)||1);
function compute(){
  const sc={}; TYPE_ORDER.forEach(k=>sc[k]=0); let near=0, dorm=0;
  S.ans.forEach((a,i)=>{ if(a===null) return; const w=QUESTIONS[i].o[a][1];
    for(const k in w){ if(k==="near") near+=w[k]; else if(k==="dorm") dorm+=w[k]; else sc[k]+=w[k]; }});
  TYPE_ORDER.forEach(k=>sc[k]=sc[k]/MAXW[k]*100);
  const max=Math.max(...Object.values(sc),1);
  const ranked = SCHOOLS.map(s=>{
    let v = sc[s.t]/max*100;
    v -= near * s.dist * 0.35;            // 가까운 학교 선호 반영
    v -= s.dist * 0.15;                    // 같은 점수면 가까운 학교 먼저
    if(s.dorm) v += dorm*2 - near*2;      // 기숙사 선호 반영
    return {s, v};
  }).sort((a,b)=>b.v-a.v);
  const top=[]; const used={};
  for(const r of ranked){ if(top.length>=3) break; if((used[r.s.t]||0)>=2) continue; used[r.s.t]=(used[r.s.t]||0)+1; top.push(r); }
  const typeRank = TYPE_ORDER.map(k=>({k,v:Math.round(sc[k]/max*100)})).sort((a,b)=>b.v-a.v);
  return {top, typeRank, near, dorm};
}

    for(const [k,val] of p.entries()){ if(Object.prototype.hasOwnProperty.call(v,val)) p.set(k,v[val]); }

  }catch(e){ return ""; }
}

    <div class="row">
      ${FORM_TEMPLATE?`<a class="btn" id="sub-go" href="${ready?esc(formUrl()):"#"}" target="_blank" rel="noopener" aria-disabled="${!ready}">구글 설문지로 제출</a>`:""}
      <button class="btn ${FORM_TEMPLATE?"ghost":""}" id="sub-copy" data-act="copy" ${ready?"":"disabled"}>결과 복사하기</button>
    </div>
    <p class="small muted" id="sub-msg">${FORM_TEMPLATE?"제출 버튼을 누르면 결과가 채워진 설문지가 열려요. 설문지에서 '제출'을 한 번 더 눌러야 완료돼요.":"복사한 결과를 선생님이 알려 준 클래스룸 과제나 게시판에 붙여 넣으세요."}</p>
  </section>`;
}

function typeMsg(k){
  const m={gen:"폭넓게 공부하며 진로를 찾아가는 일반고가 잘 맞아요. 고교학점제로 2학년부터 원하는 과목을 고를 수 있어요.",
   scif:"일반고 생활을 하면서 수학·과학을 깊게 배울 수 있는 과학중점고가 잘 맞아요.",
   art:"예술적 감각이 뛰어나요. 예술고는 중3 때 실기 시험을 보니 지금부터 꾸준히 연습하세요.",
   pe:"운동 능력과 열정이 돋보여요. 체육고는 종목 실기와 경기 실적이 중요해요.",
   apr:"도전과 경쟁을 즐기는 편이에요. 전국 단위 자사고는 학비와 기숙사 생활도 함께 고려하세요.",
   apub:"프로젝트와 지역 연계 활동을 좋아해요. 자공고 2.0은 학교 특화 과목이 많아요.",
   voc:"실무 능력을 빨리 익히고 싶어 해요. 특성화고는 취업과 대학 진학 두 길 모두 열려 있어요.",
   mei:"기술 분야 전문가가 될 자질이 있어요. 마이스터고는 우수 기업 취업에 강해요.",
   gif:"탐구 열정이 매우 강해요. 영재학교는 중3 때 지원하므로 수학·과학 심화 학습을 꾸준히 하세요.",
   intl:"세계에 관심이 많고 소통을 잘해요. 국제고는 국제 계열 전문 과목을 배워요.",
   flang:"언어 감각이 좋아요. 외고는 전공 외국어를 깊게 배워요.",
   sci:"수학·과학 실력과 탐구심이 돋보여요. 분당중앙과학고는 성남 학생 지역인재 전형이 있어요.",
   alt:"나만의 속도로 성장하고 싶어 해요. 대안 특성화고는 체험·프로젝트 중심 학교예요."};
  return m[k];
}

function vBrowse(){
  const list=SCHOOLS.filter(s=>!S.filter||s.t===S.filter).sort((a,b)=>a.dist-b.dist);
  return `<section class="panel">
    <h2>유형별 학교 보기</h2>
    <p class="small muted">학교 유형을 선택하세요. 삼평중에서 가까운 순으로 보여요.</p>
    <div class="chips">
      <button class="chip" style="--c:var(--accent)" aria-pressed="${!S.filter}" data-filter="">전체</button>
      ${TYPE_ORDER.map(k=>`<button class="chip" style="--c:${TYPES[k].c}" aria-pressed="${S.filter===k}" data-filter="${k}"><i></i>${TYPES[k].n}</button>`).join("")}
    </div>
  </section>
  <div class="list">${list.length?list.map(s=>`
    <button class="card" style="--c:${TYPES[s.t].c}" data-school="${s.id}" data-from="browse">
      <div class="row" style="justify-content:space-between;gap:8px"><h3>${esc(s.name)}</h3>${tag(s.t)}</div>
      <div class="meta"><span>${s.found} · ${esc(s.loc)}</span><span>약 ${s.dist}km · ${s.min}분</span><span>학년당 ${s.cls}학급${s.clsEst?"(추정)":""}</span></div>
    </button>`).join(""):`<p class="panel muted">이 유형의 학교 정보가 아직 없어요.</p>`}</div>
  ${note()}`;
}

function vSchool(){
  const s=SCHOOLS.find(x=>x.id===S.school), c=TYPES[s.t].c;
  const tabs=[["feat","특색 사업"],["cur","교육과정 편제표"],["pc","장점·단점"],["go","통학·학급 수"],["grad","졸업생 진학"]];
  let body="";
  if(S.dtab==="feat") body=`<div class="panel"><h3>학교 특색 사업</h3><ul class="clean">${s.feat.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>
    <div class="panel"><h3>특화 프로그램</h3><ul class="clean">${s.special.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`;
  if(S.dtab==="cur" && s.cur){
    body=`<div class="panel"><h3>2027학년도 입학생 3개년 교육과정</h3>
    <p class="small muted">${esc(s.src||"")} 기준 · 괄호 안 숫자는 학점, ↔ 는 학기를 바꿔 이수하는 과목이에요.</p>
    <div class="tablewrap"><table><thead><tr><th>구분</th><th>학교 지정 과목</th><th>학생 선택 과목</th></tr></thead>
    <tbody>${s.cur.map(r=>`<tr><th scope="row">${esc(r[0])}</th><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></div>
    ${s.extra?`<div class="panel"><h3>학생 과목 선택권 확대 (2026년 개설 과목)</h3><ul class="clean">${s.extra.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
    <p class="small muted">공동교육과정은 여러 학교 학생이 함께 듣는 수업, 소인수 선택은 신청 학생이 적어도 여는 과목이에요.</p></div>`:""}`;}
  else if(S.dtab==="cur"){ const cur=BASE_CUR[s.t];
    body=`<div class="panel"><h3>교육과정 편제표 (예시)</h3>
    <p class="small muted">2022 개정 교육과정 · 고교학점제 3년 192학점(교과 174 + 창의적 체험활동 18). ★ 표시는 이 학교 유형에서 비중이 큰 영역이에요.</p>
    <div class="tablewrap"><table><thead><tr><th>교과(군)</th><th>1학년 (공통)</th><th>2학년 (선택)</th><th>3학년 (심화·진로)</th></tr></thead>
    <tbody>${cur.map(r=>`<tr>${r.map((c,i)=>i===0?`<th scope="row">${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}
    <tr><th scope="row">창의적 체험활동</th><td colspan="3">자율·자치, 동아리, 진로 활동 (3년 18학점)</td></tr></tbody></table></div>
    <p class="note">학교별 실제 편제표는 매년 바뀌어요. 정확한 과목과 학점은 학교 홈페이지 또는 학교알리미 '교육과정 편성·운영' 공시에서 확인하세요.</p></div>`;}
  if(S.dtab==="pc") body=`<div class="pc"><div class="panel pros"><h3>＋ 장점</h3><ul class="clean">${s.pros.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>
    <div class="panel cons"><h3>－ 단점</h3><ul class="clean">${s.cons.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div></div>`;
  if(S.dtab==="go") body=`<div class="panel"><h3>삼평중학교에서 통학</h3>
    <div class="commute"><span class="small"><b>삼평중</b></span><span class="ln"></span><span class="end"></span></div>
    <div class="facts">
      <div class="fact"><div class="l">거리(약)</div><div class="n">${s.dist}km</div></div>
      <div class="fact"><div class="l">예상 시간</div><div class="n">${s.min}분</div></div>
      <div class="fact"><div class="l">이동 방법</div><div class="n" style="font-size:1.1rem">${s.mode}</div></div>
      <div class="fact"><div class="l">기숙사</div><div class="n" style="font-size:1.1rem">${s.dorm?"운영":"없음"}</div></div>
    </div>
    <p class="small muted">${s.min<=20?"걸어서 또는 짧은 버스로 다닐 수 있어요.":s.min<=40?"버스로 매일 다닐 만한 거리예요.":s.min<=60?"매일 통학하기엔 시간이 꽤 걸려요.":"매일 통학은 힘들어요. 기숙사 여부를 꼭 확인하세요."}</p></div>
    <div class="panel"><h3>학급 수</h3>
    <div class="facts">
      <div class="fact"><div class="l">학년당</div><div class="n">${s.cls}학급</div></div>
      <div class="fact"><div class="l">전체(3개 학년)</div><div class="n">${s.cls*3}학급</div></div>
      <div class="fact"><div class="l">설립</div><div class="n" style="font-size:1.1rem">${s.found}${s.girls?" · 여고":""}</div></div>
    </div>
    ${s.stu?`<div class="tablewrap"><table style="min-width:0"><thead><tr><th>학년</th><th>학급 수</th><th>학생 수</th></tr></thead><tbody>${s.stu.map((n,i)=>`<tr><th scope="row">${i+1}학년</th><td>${s.cls}학급</td><td>${n}명</td></tr>`).join("")}<tr><th scope="row">합계</th><td>${s.cls*3}학급</td><td>${s.stu.reduce((a,b)=>a+b,0)}명</td></tr></tbody></table></div>`:""}
    ${s.stuNote?`<p class="small muted">${esc(s.stuNote)}</p>`:""}
    ${s.clsEst?`<p class="note">학급 수는 추정치예요. 학교알리미 '학년별·학급별 학생 수'에서 확인하세요.</p>`:`<p class="small muted">${esc(s.src||"공식 발표")} 기준이에요.</p>`}
    ${s.tel?`<p class="small">학교 전화: <span style="user-select:all">${esc(s.tel)}</span></p>`:""}</div>`;
  if(S.dtab==="grad"){ if(!s.grad) body=`<div class="panel"><h3>졸업생 진학 현황</h3><p>${esc(s.gradNote)}</p></div>`;
    else { const g=s.grad, segs=[["4년제 대학",g.u4,c],["전문대학",g.jr,"color-mix(in srgb, "+c+" 55%, var(--surface))"],["취업",g.job,"var(--warn)"],["기타(재수 등)",g.etc,"var(--line)"]];
    body=`<div class="panel"><h3>졸업생 진학 현황 (경향)</h3>
      <div class="stack">${segs.map(x=>`<span style="width:${x[1]}%;background:${x[2]}" title="${x[0]} ${x[1]}%"></span>`).join("")}</div>
      <div class="legend">${segs.map(x=>`<span><i style="background:${x[2]}"></i>${x[0]} ${x[1]}%</span>`).join("")}</div>
      ${s.gradNote?`<p class="small">${esc(s.gradNote)}</p>`:""}
      <p class="note">학교 유형과 지역 특성을 바탕으로 한 추정 비율이에요. 실제 수치는 학교알리미 '졸업생의 진로 현황'에서 확인하세요.</p></div>`;}}
  return `<button class="back" data-go="${S.from}">← 목록으로</button>
  <section class="panel" style="--c:${c};border-top:6px solid ${c}">
    <div class="row" style="gap:8px">${tag(s.t)}<span class="small muted">${s.found}</span></div>
    <h2>${esc(s.name)}</h2>
    <p class="muted small">${esc(s.loc)} · 삼평중에서 약 ${s.dist}km, ${s.min}분</p>
    <div class="dtabs" role="tablist" style="--c:${c}">${tabs.map(t=>`<button role="tab" aria-selected="${S.dtab===t[0]}" data-dtab="${t[0]}">${t[1]}</button>`).join("")}</div>
  </section>
  ${body}
  <p class="small muted">학교 공식 정보: <a href="${s.url}" target="_blank" rel="noopener" style="color:var(--accent)">학교알리미·관련 자료 열기</a></p>`;
}

function note(){
  return `<p class="note">이 결과는 진로 탐색을 위한 참고 자료예요. 학급 수·통학 시간·진학 비율 중 '추정'으로 표시된 수치는 실제와 다를 수 있으니, 지원 전 학교알리미(schoolinfo.go.kr)와 각 학교 입학설명회에서 꼭 확인하세요. (2026년 11월 기준)</p>`;
}

function render(){
  if(!USER){ $app.innerHTML=header()+vLogin(); return; }
  const v={home:vHome,quiz:vQuiz,result:vResult,browse:vBrowse,school:vSchool}[S.view]();
  $app.innerHTML=header()+v;
}

$app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.go!==undefined){ S.view=b.dataset.go; if(b.dataset.filter!==undefined) S.filter=b.dataset.filter||null; if(S.view!=="school") S.from=S.view==="browse"?"browse":"result"; render(); window.scrollTo(0,0); return; }
  if(b.dataset.filter!==undefined){ S.filter=b.dataset.filter||null; render(); return; }
  if(b.dataset.school){ S.school=b.dataset.school; S.from=b.dataset.from; S.dtab="feat"; S.view="school"; render(); window.scrollTo(0,0); return; }
  if(b.dataset.dtab){ S.dtab=b.dataset.dtab; render(); return; }
  if(b.dataset.pick!==undefined){ S.ans[S.qi]=+b.dataset.pick;
    if(S.qi<QUESTIONS.length-1){ S.qi++; render(); }
    else { S.result=compute(); try{localStorage.setItem("goip-ans-"+USER.id,JSON.stringify(S.ans))}catch(e){} S.view="result"; S.from="result"; render(); window.scrollTo(0,0); }
    return; }
  const act=b.dataset.act;
  if(act==="logout"){
    USER=null; try{localStorage.removeItem("goip-user")}catch(e){}
    S.view="home"; S.from="home"; S.qi=0; S.ans=Array(QUESTIONS.length).fill(null); S.result=null;
    render(); window.scrollTo(0,0); const f=document.getElementById("login-id"); if(f) f.focus(); return;
  }
  if(act==="copy"){
    const txt=resultText(), msg=document.getElementById("sub-msg");
    const done=()=>{ if(msg){msg.textContent="복사했어요! 선생님이 알려 준 곳에 붙여 넣으세요."; msg.className="ok";} };
    const fallback=()=>{ if(msg){ msg.className="small"; msg.innerHTML=`<textarea id="sub-txt" readonly rows="7" style="width:100%;font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px">${esc(txt)}</textarea>`; const t=document.getElementById("sub-txt"); t.focus(); t.select(); } };
    try{ navigator.clipboard.writeText(txt).then(done,fallback); }catch(e){ fallback(); }
    return;
  }
  if(act==="start"||act==="restart"){ S.qi=0; S.ans=Array(QUESTIONS.length).fill(null); S.view="quiz"; render(); window.scrollTo(0,0); }
  if(act==="prev"&&S.qi>0){ S.qi--; render(); }
});
$app.addEventListener("input",e=>{
  if(e.target.id!=="login-id") return;
  e.target.value=e.target.value.replace(/\D/g,"").slice(0,5);
  const p=parseId(e.target.value), pv=document.getElementById("login-preview");
  if(pv && p) pv.innerHTML=`<b>${idLabel(p)}</b> 맞나요?`;
});
$app.addEventListener("submit",e=>{
  if(e.target.id!=="login-form") return;
  e.preventDefault();
  const idv=document.getElementById("login-id").value.trim(), nm=document.getElementById("login-name").value.trim();
  const err=document.getElementById("login-err"), p=parseId(idv);
  if(!p){ err.textContent="학번을 다시 확인해 주세요. 학년 + 반 + 번호 2자리로 4~5자리 숫자예요. (예: 1학년 1반 5번 → 1105)"; document.getElementById("login-id").focus(); return; }
  if(!validName(nm)){ err.textContent="이름을 한글 또는 영문 2~10자로 입력해 주세요."; document.getElementById("login-name").focus(); return; }
  USER={...p,name:nm};
  try{localStorage.setItem("goip-user",JSON.stringify({id:p.id,name:nm}))}catch(er){}
  loadAnswers(); S.view=S.result?"result":"home"; S.from="result";
  render(); window.scrollTo(0,0);
});
loadAnswers();
render();
</script>

</body>
</html>
